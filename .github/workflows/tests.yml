name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.8.6"

      # Configuration lives in pyproject.toml ([tool.ruff]).
      - name: Run ruff
        run: ruff check .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Default selection from pytest.ini: integration and e2e tests stay
      # deselected (they need a live LLM server, API keys and a browser).
      - name: Run pytest
        run: python -m pytest -q --no-header -p no:cacheprovider
